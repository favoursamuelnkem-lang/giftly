
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password — Giftly</title>

    <link
        rel="stylesheet"
        href="./output.css"
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

</head>


<body class="min-h-screen bg-[#FAFAF8] text-[#17201E] font-['Inter']">


    <div class="min-h-screen flex flex-col">


        <!-- HEADER -->

        <header class="px-5 sm:px-8 py-5">

            <div
                class="max-w-7xl mx-auto flex items-center justify-between"
            >

                <a
                    href="index.html"
                    class="flex items-center gap-2.5"
                >

                    <div
                        class="w-10 h-10 rounded-xl bg-[#D97706] text-white flex items-center justify-center font-extrabold shadow-sm"
                    >
                        G
                    </div>

                    <span
                        class="text-xl font-extrabold tracking-tight"
                    >
                        Giftly
                    </span>

                </a>


                <a
                    href="login.html"
                    class="text-sm font-bold text-[#D97706] hover:text-[#B45309] transition"
                >
                    Back to Login
                </a>

            </div>

        </header>



        <!-- MAIN -->

        <main
            class="flex-1 flex items-center justify-center px-5 sm:px-8 py-10"
        >

            <div class="w-full max-w-md">


                <!-- ICON -->

                <div class="text-center">

                    <div
                        class="mx-auto w-14 h-14 rounded-2xl bg-[#FFF7ED] border border-[#FED7AA] flex items-center justify-center"
                    >

                        <svg
                            class="w-7 h-7 text-[#D97706]"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                            stroke-width="1.8"
                        >

                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M12 15v2m-6 4h12a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2Zm3-9V7a3 3 0 1 1 6 0v3"
                            />

                        </svg>

                    </div>


                    <h1
                        class="mt-6 text-3xl sm:text-4xl font-extrabold tracking-tight"
                    >
                        Forgot your password?
                    </h1>


                    <p
                        class="mt-3 text-sm sm:text-base leading-6 text-gray-500"
                    >
                        Enter the email address connected to your Giftly
                        account and we'll help you reset your password.
                    </p>

                </div>



                <!-- FORM -->

                <div
                    class="mt-8 bg-white border border-gray-200 rounded-2xl p-5 sm:p-7 shadow-sm"
                >

                    <form id="forgotPasswordForm">


                        <!-- EMAIL -->

                        <div>

                            <label
                                for="email"
                                class="block text-sm font-semibold"
                            >
                                Email address
                            </label>


                            <input
                                id="email"
                                type="email"
                                autocomplete="email"
                                placeholder="you@example.com"
                                class="mt-2 w-full h-12 px-4 rounded-xl border border-gray-200 bg-white text-sm outline-none placeholder:text-gray-400 focus:border-[#D97706] focus:ring-4 focus:ring-orange-100 transition"
                            >

                        </div>



                        <!-- ERROR -->

                        <div
                            id="errorMessage"
                            class="hidden mt-4 rounded-xl bg-red-50 border border-red-100 px-4 py-3 text-xs font-medium text-red-600"
                        ></div>



                        <!-- SUCCESS -->

                        <div
                            id="successMessage"
                            class="hidden mt-4 rounded-xl bg-green-50 border border-green-100 px-4 py-3 text-xs font-medium text-green-700"
                        ></div>



                        <!-- BUTTON -->

                        <button
                            type="submit"
                            class="mt-6 w-full h-12 rounded-xl bg-[#D97706] text-white text-sm font-bold hover:bg-[#B45309] transition shadow-sm"
                        >
                            Send Reset Link
                        </button>


                    </form>



                    <!-- BACK TO LOGIN -->

                    <div class="mt-6 text-center">

                        <a
                            href="login.html"
                            class="text-sm font-semibold text-gray-500 hover:text-[#D97706] transition"
                        >
                            ← Back to login
                        </a>

                    </div>

                </div>



                <!-- NOTE -->

                <p
                    class="mt-6 text-center text-xs leading-5 text-gray-400"
                >
                    For your security, password reset links will expire
                    after a limited period.
                </p>

            </div>

        </main>



        <!-- FOOTER -->

        <footer class="px-5 sm:px-8 py-6">

            <div
                class="max-w-7xl mx-auto text-center text-xs text-gray-400"
            >
                © 2026 Giftly. All rights reserved.
            </div>

        </footer>

    </div>



    <!-- JAVASCRIPT -->

    <script>

        const form =
            document.getElementById("forgotPasswordForm");

        const email =
            document.getElementById("email");

        const errorMessage =
            document.getElementById("errorMessage");

        const successMessage =
            document.getElementById("successMessage");


        form.addEventListener("submit", (event) => {

            event.preventDefault();


            errorMessage.classList.add("hidden");

            successMessage.classList.add("hidden");


            const emailValue =
                email.value.trim();


            if (!emailValue) {

                showError(
                    "Please enter your email address."
                );

                return;

            }


            if (!emailValue.includes("@")) {

                showError(
                    "Please enter a valid email address."
                );

                return;

            }


            /*
                TEMPORARY FRONTEND TEST

                The real password-reset request will be
                connected to the backend later.
            */

            successMessage.textContent =
                "If an account exists with this email, a password reset link will be sent.";

            successMessage.classList.remove("hidden");

        });


        function showError(message) {

            errorMessage.textContent =
                message;

            errorMessage.classList.remove("hidden");

        }

    </script>


</body>

</html>
