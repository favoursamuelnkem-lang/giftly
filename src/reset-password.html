
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password — Giftly</title>

    <link
        rel="stylesheet"
        href="./output.css"
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

</head>


<body class="min-h-screen bg-[#FAFAF8] text-[#17201E] font-['Inter']">


    <div class="min-h-screen flex flex-col">


        <!-- =================================================
             HEADER
        ================================================== -->

        <header class="px-5 sm:px-8 py-5">

            <div
                class="max-w-7xl mx-auto flex items-center justify-between"
            >

                <!-- LOGO -->

                <a
                    href="index.html"
                    class="flex items-center gap-2.5"
                >

                    <div
                        class="w-10 h-10 rounded-xl bg-[#D97706] text-white flex items-center justify-center font-extrabold shadow-sm"
                    >
                        G
                    </div>

                    <span
                        class="text-xl font-extrabold tracking-tight"
                    >
                        Giftly
                    </span>

                </a>


                <a
                    href="login.html"
                    class="text-sm font-bold text-[#D97706] hover:text-[#B45309] transition"
                >
                    Log in
                </a>

            </div>

        </header>



        <!-- =================================================
             MAIN
        ================================================== -->

        <main
            class="flex-1 flex items-center justify-center px-5 sm:px-8 py-10 sm:py-14"
        >

            <div class="w-full max-w-md">


                <!-- INTRO -->

                <div class="text-center">

                    <div
                        class="mx-auto w-14 h-14 rounded-2xl bg-[#FFF7ED] border border-[#FED7AA] flex items-center justify-center"
                    >

                        <svg
                            class="w-7 h-7 text-[#D97706]"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                            stroke-width="1.8"
                        >

                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M12 15v2m-6 4h12a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2Zm3-9V7a3 3 0 1 1 6 0v3"
                            />

                        </svg>

                    </div>


                    <h1
                        class="mt-6 text-3xl sm:text-4xl font-extrabold tracking-tight"
                    >
                        Create a new password
                    </h1>


                    <p
                        class="mt-3 text-sm sm:text-base leading-6 text-gray-500"
                    >
                        Choose a strong password for your Giftly account.
                    </p>

                </div>



                <!-- =================================================
                     FORM CARD
                ================================================== -->

                <div
                    class="mt-8 bg-white border border-gray-200 rounded-2xl p-5 sm:p-7 shadow-sm"
                >

                    <form id="resetPasswordForm">


                        <!-- NEW PASSWORD -->

                        <div>

                            <label
                                for="newPassword"
                                class="block text-sm font-semibold"
                            >
                                New password
                            </label>


                            <div class="relative">

                                <input
                                    id="newPassword"
                                    type="password"
                                    autocomplete="new-password"
                                    placeholder="Enter your new password"
                                    class="mt-2 w-full h-12 px-4 pr-12 rounded-xl border border-gray-200 bg-white text-sm outline-none placeholder:text-gray-400 focus:border-[#D97706] focus:ring-4 focus:ring-orange-100 transition"
                                >


                                <button
                                    id="toggleNewPassword"
                                    type="button"
                                    aria-label="Show password"
                                    class="absolute right-3 top-[17px] w-8 h-8 rounded-lg text-gray-400 hover:text-[#17201E] hover:bg-gray-50 transition"
                                >

                                    <svg
                                        class="w-5 h-5 mx-auto"
                                        fill="none"
                                        stroke="currentColor"
                                        viewBox="0 0 24 24"
                                        stroke-width="1.8"
                                    >

                                        <path
                                            stroke-linecap="round"
                                            stroke-linejoin="round"
                                            d="M2.25 12s3.75-6.75 9.75-6.75S21.75 12 21.75 12 18 18.75 12 18.75 2.25 12 2.25 12Z"
                                        />

                                        <circle
                                            cx="12"
                                            cy="12"
                                            r="2.5"
                                        />

                                    </svg>

                                </button>

                            </div>


                            <p class="mt-2 text-xs text-gray-400">
                                Use at least 8 characters.
                            </p>

                        </div>



                        <!-- CONFIRM PASSWORD -->

                        <div class="mt-5">

                            <label
                                for="confirmPassword"
                                class="block text-sm font-semibold"
                            >
                                Confirm new password
                            </label>


                            <div class="relative">

                                <input
                                    id="confirmPassword"
                                    type="password"
                                    autocomplete="new-password"
                                    placeholder="Repeat your new password"
                                    class="mt-2 w-full h-12 px-4 pr-12 rounded-xl border border-gray-200 bg-white text-sm outline-none placeholder:text-gray-400 focus:border-[#D97706] focus:ring-4 focus:ring-orange-100 transition"
                                >


                                <button
                                    id="toggleConfirmPassword"
                                    type="button"
                                    aria-label="Show password"
                                    class="absolute right-3 top-[17px] w-8 h-8 rounded-lg text-gray-400 hover:text-[#17201E] hover:bg-gray-50 transition"
                                >

                                    <svg
                                        class="w-5 h-5 mx-auto"
                                        fill="none"
                                        stroke="currentColor"
                                        viewBox="0 0 24 24"
                                        stroke-width="1.8"
                                    >

                                        <path
                                            stroke-linecap="round"
                                            stroke-linejoin="round"
                                            d="M2.25 12s3.75-6.75 9.75-6.75S21.75 12 21.75 12 18 18.75 12 18.75 2.25 12 2.25 12Z"
                                        />

                                        <circle
                                            cx="12"
                                            cy="12"
                                            r="2.5"
                                        />

                                    </svg>

                                </button>

                            </div>

                        </div>



                        <!-- PASSWORD CHECKLIST -->

                        <div
                            class="mt-5 rounded-xl bg-[#FAFAF8] border border-gray-100 p-4"
                        >

                            <p
                                class="text-xs font-bold text-[#17201E]"
                            >
                                Password requirements
                            </p>


                            <div
                                class="mt-3 space-y-2 text-xs text-gray-400"
                            >

                                <p
                                    id="lengthCheck"
                                    class="flex items-center gap-2"
                                >
                                    <span>○</span>
                                    At least 8 characters
                                </p>


                                <p
                                    id="matchCheck"
                                    class="flex items-center gap-2"
                                >
                                    <span>○</span>
                                    Passwords match
                                </p>

                            </div>

                        </div>



                        <!-- ERROR -->

                        <div
                            id="errorMessage"
                            class="hidden mt-4 rounded-xl bg-red-50 border border-red-100 px-4 py-3 text-xs font-medium text-red-600"
                        ></div>



                        <!-- SUCCESS -->

                        <div
                            id="successMessage"
                            class="hidden mt-4 rounded-xl bg-green-50 border border-green-100 px-4 py-3 text-xs font-medium text-green-700"
                        ></div>



                        <!-- SUBMIT -->

                        <button
                            type="submit"
                            class="mt-6 w-full h-12 rounded-xl bg-[#D97706] text-white text-sm font-bold hover:bg-[#B45309] transition shadow-sm"
                        >
                            Reset Password
                        </button>


                    </form>



                    <!-- BACK TO LOGIN -->

                    <div class="mt-6 text-center">

                        <a
                            href="login.html"
                            class="text-sm font-semibold text-gray-500 hover:text-[#D97706] transition"
                        >
                            ← Back to login
                        </a>

                    </div>

                </div>



                <!-- SECURITY NOTE -->

                <div
                    class="mt-6 flex items-center justify-center gap-2 text-xs text-gray-400"
                >

                    <svg
                        class="w-4 h-4"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                        stroke-width="2"
                    >

                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M12 3l7 3v5c0 4.5-3 7.5-7 10-4-2.5-7-5.5-7-10V6l7-3Z"
                        />

                    </svg>

                    Reset links are temporary and secure.

                </div>

            </div>

        </main>



        <!-- =================================================
             FOOTER
        ================================================== -->

        <footer class="px-5 sm:px-8 py-6">

            <div
                class="max-w-7xl mx-auto text-center text-xs text-gray-400"
            >
                © 2026 Giftly. All rights reserved.
            </div>

        </footer>

    </div>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>


        const newPassword =
            document.getElementById("newPassword");

        const confirmPassword =
            document.getElementById("confirmPassword");


        // =====================================================
        // SHOW / HIDE NEW PASSWORD
        // =====================================================

        document
            .getElementById("toggleNewPassword")
            .addEventListener("click", () => {

                newPassword.type =
                    newPassword.type === "password"
                        ? "text"
                        : "password";

            });


        // =====================================================
        // SHOW / HIDE CONFIRM PASSWORD
        // =====================================================

        document
            .getElementById("toggleConfirmPassword")
            .addEventListener("click", () => {

                confirmPassword.type =
                    confirmPassword.type === "password"
                        ? "text"
                        : "password";

            });



        // =====================================================
        // PASSWORD REQUIREMENTS
        // =====================================================

        const lengthCheck =
            document.getElementById("lengthCheck");

        const matchCheck =
            document.getElementById("matchCheck");


        function updateRequirements() {

            const validLength =
                newPassword.value.length >= 8;

            const passwordsMatch =
                newPassword.value.length > 0 &&
                newPassword.value === confirmPassword.value;


            lengthCheck.innerHTML =
                validLength
                    ? '<span>✓</span> At least 8 characters'
                    : '<span>○</span> At least 8 characters';


            matchCheck.innerHTML =
                passwordsMatch
                    ? '<span>✓</span> Passwords match'
                    : '<span>○</span> Passwords match';

        }


        newPassword.addEventListener(
            "input",
            updateRequirements
        );


        confirmPassword.addEventListener(
            "input",
            updateRequirements
        );



        // =====================================================
        // FORM
        // =====================================================

        const form =
            document.getElementById("resetPasswordForm");

        const errorMessage =
            document.getElementById("errorMessage");

        const successMessage =
            document.getElementById("successMessage");


        form.addEventListener("submit", (event) => {

            event.preventDefault();


            errorMessage.classList.add("hidden");

            successMessage.classList.add("hidden");


            if (newPassword.value.length < 8) {

                showError(
                    "Your password must contain at least 8 characters."
                );

                return;

            }


            if (
                newPassword.value !==
                confirmPassword.value
            ) {

                showError(
                    "Your passwords do not match."
                );

                return;

            }


            /*
                TEMPORARY FRONTEND TEST

                The real password reset will be handled
                securely by the backend using a reset token.
            */

            successMessage.textContent =
                "Password reset successful. You can now log in.";

            successMessage.classList.remove("hidden");

        });


        function showError(message) {

            errorMessage.textContent =
                message;

            errorMessage.classList.remove("hidden");

        }

    </script>


</body>

</html>
